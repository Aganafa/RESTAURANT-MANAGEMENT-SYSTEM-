


<html>

<head>
  <title>Login - Food Land Restaurant</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: url('hero.jpeg') no-repeat center center/cover;
      font-family: 'Poppins', sans-serif;
    }

    .login-box {
      width: 350px;
      margin: 120px auto;
      
      padding: 40px;
      background-color: transparent;
      backdrop-filter: blur(1px);

      
      border-radius: 20px;
      color: white;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 20px;
      color: orange;
    }

    .login-box input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    .login-box button {
      width: 95%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: orange;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #e68900;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form action="rest.html" method="post">
      <input type="text" name="admin" placeholder="Username" required><br>
      <input type="password" name="123" placeholder="Password" required><br>
      <button type="submit">
        

        <a href="rest.html">login</a>
        
    </form>
  </div>
</body>
</html>
